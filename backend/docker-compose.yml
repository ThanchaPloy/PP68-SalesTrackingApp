services:
  backend:
    build: .
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MAPS_API_KEY: ${MAPS_API_KEY}
        POSTGREST_URL: ${POSTGREST_URL}
        BASE_AUTH_URL: ${BASE_AUTH_URL}
        UPLOAD_URL: ${UPLOAD_URL}
        JWT_SECRET: ${JWT_SECRET}

volumes:
  uploads:
